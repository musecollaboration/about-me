# ============================================================
#  Основные метаданные сайта
# ============================================================
site_name: Блог Разработчика
site_url: https://musecollaboration.github.io/about-me/
site_author: Александр Терехов

copyright: © Александр Терехов

# ============================================================
#  Тема оформления
# ============================================================
theme:
  name: material
  language: ru

  icon:
    logo: material/code-braces

  # Современные шрифты (Google Fonts). Для полностью офлайн-режима: font: false
  font:
    text: Inter
    code: JetBrains Mono

  # Тёмная тема по умолчанию (первая палитра) + переключатель на светлую.
  # Без media: система не влияет на выбор, но выбор пользователя запоминается.
  palette:
    # Тёмная — по умолчанию
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Переключиться на светлую тему

    # Светлая — по кнопке
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Переключиться на тёмную тему

  # Встроенные возможности Material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

# ============================================================
#  Кастомные стили
# ============================================================
extra_css:
  - stylesheets/extra.css

# ============================================================
#  Markdown-расширения (admonitions, таблицы, блоки кода)
# ============================================================
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# ============================================================
#  Дополнительно
# ============================================================
extra:
  generator: false

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/musecollaboration
    - icon: fontawesome/solid/graduation-cap
      link: https://stepik.org/a/223717
      name: "Backend на FastAPI: Курс для инженеров"

repo_url: https://github.com/musecollaboration/about-me
repo_name: about-me
edit_uri: edit/main/docs/

watch:
  - docs

# ============================================================
#  Навигация
# ============================================================
nav:
  - Дорожная карта: index.md
  - Обо Мне: about.md
